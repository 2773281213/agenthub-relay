或运行 agenthub-relay 时\n- **skill 里的 hub 只能由 src/ 生成**：修改 src/ 或发布 skill 时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"topic-interfaces-boundaries":{"body":"# 模块边界\n\n- **核心代码不假设规划者身份**：在本仓库开发或运行 agenthub-relay 时\n- **预留执行者失败关闭**：在本仓库开发或运行 agenthub-relay 时"},"rule-planner-neutral":{"body":"# 核心代码不假设规划者身份\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：后端。规则作用于该角色职责。\n\n## 具体要求\n\n适用于全部 src 代码；Claude 专属逻辑只能放在 hooks/、types/、.claude-plugin/。\n\n## 怎么检查\n\n审查 src/ 中是否出现规划者特判，并用非 Claude 客户端名跑 MCP 流程测试。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:7-7`\n\n> - Keep the hub planner-neutral: code under `src/` must not assume which agent is the planner; Claude Code specific behavior lives only in `hooks/`, `types/` and `.claude-plugin/`.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"rule-reserved-fail-closed":{"body":"# 预留执行者失败关闭\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：后端。规则约束的对象属于该角色的模块：dispatch-policy、executor-adapters\n\n## 具体要求\n\nagy 与通用 ACP 在 v0.1 只预留，派发必须报出原因。\n\n## 怎么检查\n\n测试向 agy 派发时返回带原因的错误且不建 worktree。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:9-9`\n\n> - Treat Antigravity (`agy`) and the generic ACP executor as reserved until their adapters exist: dispatching to a reserved executor must fail closed with an error that names the reason.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:20:22+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 6830d4d638d207bb78e9bb6f064bbe669da5a179 · 2026-10-29T20:20:22+08:00\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"topic-delivery-packaging":{"body":"# 交付形态\n\n- **零运行时依赖**：在本仓库开发或运行 agenthub-relay 时\n- **skill 里的 hub 只能由 src/ 生成**：修改 src/ 或发布 skill 时"},"rule-no-runtime-deps":{"body":"# 零运行时依赖\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：后端。规则约束的对象属于该角色的模块：planner-surface、dispatch-policy、job-store、git-isolation、executor-adapters、worker-runner\n\n## 具体要求\n\n适用于 hub 运行时的全部模块。\n\n## 怎么检查\n\n检查 package.json 无 dependencies，并扫描 src/ 的 import 只来自 node:。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:8-8`\n\n> - Use no runtime dependencies: the hub ships as plain ESM JavaScript for Node.js 20 or newer, and code under `src/` imports only the Node.js standard library.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"rule-skill-copy-generated":{"body":"# skill 里的 hub 只能由 src/ 生成\n\n## 什么时候用\n\n修改 src/ 或发布 skill 时\n\n适用性：适用\n\n适用角色：通用。规则约束的对象是 skill 目录里的生成副本。\n\n## 具体要求\n\n安装出去的 skill 必须与经过测试的源码一致。\n\n## 怎么检查\n\nnode tools/bundle-skill.mjs --check；skill-bundle 测试。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:10-10`\n\n> - Generate `skills/agenthub-relay/scripts/` from `src/` with `npm run bundle:skill` and never edit that copy by hand; it must stay identical to `src/`, which `npm test` checks.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:20:22+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 6830d4d638d207bb78e9bb6f064bbe669da5a179 · 2026-10-29T20:20:22+08:00\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"topic-security-isolation":{"body":"# 隔离与权限\n\n- **执行者只在自己的 worktree 写**：在本仓库开发或运行 agenthub-relay 时\n- **并发写范围不得重叠**：在本仓库开发或运行 agenthub-relay 时\n- **执行者禁止再派发**：在本仓库开发或运行 agenthub-relay 时"},"rule-worktree-only":{"body":"# 执行者只在自己的 worktree 写\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：安全。规则约束的对象属于该角色的模块：git-isolation、worker-runner\n\n## 具体要求\n\n主工作区只经 relay_apply 改变。\n\n## 怎么检查\n\n集成测试确认任务结束后主工作区未变，apply 后才出现改动。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:14-14`\n\n> - Run every executor inside its own git worktree under `.agenthub/worktrees/`; the main working tree may change only through `relay_apply`.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"rule-scope-overlap":{"body":"# 并发写范围不得重叠\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：安全。规则约束的对象属于该角色的模块：dispatch-policy、job-store\n\n## 具体要求\n\n按目录前缀匹配，避免两个执行者同时改同一处。\n\n## 怎么检查\n\n单元测试前缀判定，集成测试重叠派发被拒。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:16-16`\n\n> - Refuse a write job whose scope overlaps the scope of an active write job, using directory-prefix matching (`src/api` covers `src/api/x.ts` but not `src/api-other.ts`).\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"rule-executor-role":{"body":"# 执行者禁止再派发\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：安全。规则约束的对象属于该角色的模块：dispatch-policy、worker-runner、claude-planner-mod\n\n## 具体要求\n\n执行者既不能再派发，也不能修改 relay 设置；mod 在该角色下不启用。\n\n## 怎么检查\n\n测试带该环境变量时 relay_dispatch 被拒、mod 不注册定时器。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:17-17`\n\n> - Mark executor processes with `AGENTHUB_RELAY_ROLE=executor`; in that role the hub must refuse dispatching and changing the relay settings, and the Claude Code mod must stay inactive.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:20:22+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20 未运行与退出码一一对应；有失败即任务失败。\n\n## 怎么检查\n\n测试通过、失败、超时三种检查的记录与任务终态。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:22-22`\n\n> - Record checks with Birdview semantics: `passed` requires exit code 0, `failed` requires a non-zero exit code and `not-run` requires a null exit code; a job with any failed check ends as `failed`, and a job without checks is reported as unverified.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"rule-tests":{"body":"# 行为改动必须附测试\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n适用于全项目；hooks/ 还需 claude plugin test。\n\n## 怎么检查\n\nCI 与本地运行 node --test 和 claude plugin test。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:23-23`\n\n> - Ship every behavior change with a `node --test` test that exercises observable behavior through public interfaces; changes to `hooks/` also need `claude plugin test` coverage.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"topic-lifecycle-keepalive":{"body":"# 缓存保活\n\n- **保活只用 fork 且有边界**：在本仓库开发或运行 agenthub-relay 时"},"rule-keepalive":{"body":"# 保活只用 fork 且有边界\n\n## 什么时候用\n\n在本仓库开发或运行 agenthub-relay 时\n\n适用性：适用\n\n适用角色：缓存。规则约束的对象属于该角色的模块：claude-planner-mod\n\n## 具体要求\n\n只在有任务运行、缓存仍热、未超上限时保活，且不增加对话轮次。\n\n## 怎么检查\n\n用模拟时钟测试无任务不 fork、冷缓存不 fork、超上限停止。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:27-27`\n\n> - Keep the Claude Code planner's prompt cache warm only through `$.model.fork`, only while relay jobs are running, never once the cache is presumed cold, and never beyond the configured ceiling; keep-alive must not add turns to the transcript.\n\n来源文件最后修改：2026-10-29T20:20:22+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-27T21:10:39+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- 47e247b1be78d60a0e2c00a1d2c106a373b295be · 2026-10-27T21:10:39+08:00"},"topic-interfaces-planner-routing":{"body":"# 规划者派发\n\n- **任务里不写密钥**：规划者撰写派发任务时\n- **按 watcher.active 决定怎么等待**：规划者派发后等待时\n- **completed 不等于正确**：规划者审阅结果时\n- **Birdview 启用时先确认计划再派发**：Birdview 对当前任务启用时\n- **只在用户要求时保存执行者与模型选择**：用户在对话里指定执行者或模型时"},"rule-no-secrets-in-task":{"body":"# 任务里不写密钥\n\n## 什么时候用\n\n规划者撰写派发任务时\n\n适用性：按条件适用\n\n适用角色：安全。规则约束凭据的传递方式。\n\n## 具体要求\n\n执行者只能按变量名拿到凭据，任务文本会被记录。\n\n## 怎么检查\n\n审阅任务文本；在 .agenthub/config.json 里用 passEnv 传变量名。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/agenthub-relay/SKILL.md:67-67`\n\n> Pass the task on stdin (`--task-file -`) to avoid shell quoting. Never put secrets in a task. Executors receive credentials only by variable name (`passEnv` in `.agenthub/config.json`, edited by hand).\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:17:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- fdfcfa366916f6cdbcd16bfbc8ec25d0ecbd8cc1 · 2026-10-29T20:17:57+08:00\n- a17441ddcf8d19a1510ee7122cf606e7958d1c9a · 2026-10-29T14:06:40+08:00"},"rule-wait-by-watcher":{"body":"# 按 watcher.active 决定怎么等待\n\n## 什么时候用\n\n规划者派发后等待时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n有观察者就结束本轮，否则用 relay_wait 轮询。\n\n## 怎么检查\n\n检查 relay_dispatch 返回的 watcher 字段。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/agenthub-relay/SKILL.md:71-71`\n\n> - With the relay_* MCP tools in Claude Code: if the dispatch result says `watcher.active: true`, end your turn; the Claude Code mod wakes you when a job ends and keeps your prompt cache warm meanwhile.\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:17:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- fdfcfa366916f6cdbcd16bfbc8ec25d0ecbd8cc1 · 2026-10-29T20:17:57+08:00\n- a17441ddcf8d19a1510ee7122cf606e7958d1c9a · 2026-10-29T14:06:40+08:00"},"rule-completed-not-proof":{"body":"# completed 不等于正确\n\n## 什么时候用\n\n规划者审阅结果时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n检查只覆盖它测的内容，没有检查的任务记为未验证。\n\n## 怎么检查\n\n读 relay_result 的 checks 与 verification 字段。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/agenthub-relay/SKILL.md:81-81`\n\n> A completed job is not proof: \"checks passed\" covers only what the checks test, and a job without checks is unverified.\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-29T14:06:40+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- a17441ddcf8d19a1510ee7122cf606e7958d1c9a · 2026-10-29T14:06:40+08:00"},"rule-birdview-before-dispatch":{"body":"# Birdview 启用时先确认计划再派发\n\n## 什么时候用\n\nBirdview 对当前任务启用时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n派发的写任务属于 Birdview 展示的计划或评审方案的范围。\n\n## 怎么检查\n\n派发前确认用户已对展示的计划给出明确答复。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/agenthub-relay/SKILL.md:85-85`\n\n> When Birdview is active for the task, confirm Birdview's displayed plan, or the birdview-review proposal being implemented, before dispatching any job that changes files; dispatched jobs are part of that plan's scope and are recorded as its activity. Read-only `review` jobs may run before confirmation.\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:17:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- fdfcfa366916f6cdbcd16bfbc8ec25d0ecbd8cc1 · 2026-10-29T20:17:57+08:00\n- a17441ddcf8d19a1510ee7122cf606e7958d1c9a · 2026-10-29T14:06:40+08:00"},"rule-save-choice-when-asked":{"body":"# 只在用户要求时保存执行者与模型选择\n\n## 什么时候用\n\n用户在对话里指定执行者或模型时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n单次指定只作用于那一次派发；长期设置需要用户明确要求，并先说明要写什么。\n\n## 怎么检查\n\nconfig set 之前先复述将写入的键与值。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/agenthub-relay/SKILL.md:38-38`\n\n> - Save a choice with `config set` only when the user asks for it to stick (\"from now on, light work uses …\"). Say what you will write before you write it. Tier values are `executor[:model][@effort]`, for example `config set profiles.thread16.deep claude:opus@high`; `--user` saves it for every project.\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-10-29T20:17:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- fdfcfa366916f6cdbcd16bfbc8ec25d0ecbd8cc1 · 2026-10-29T20:17:57+08:00\n- a17441ddcf8d19a1510ee7122cf606e7958d1c9a · 2026-10-29T14:06:40+08:00"},"topic-interfaces-relay-status-entry":{"body":"# 查看与集成任务\n\n- **Birdview 启用时只 apply 已确认计划内的任务**：Birdview 对当前任务启用、用户经 relay-status 决定 apply 时"},"rule-status-birdview-apply":{"body":"# Birdview 启用时只 apply 已确认计划内的任务\n\n## 什么时候用\n\nBirdview 对当前任务启用、用户经 relay-status 决定 apply 时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\napply 会改主工作区，必须属于已确认的计划，并先记录到 Birdview 活动。\n\n## 怎么检查\n\napply 前核对任务范围在已确认计划内。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/relay-status/SKILL.md:15-15`\n\n> When Birdview is active, apply only jobs that belong to the plan the user confirmed, and record the edit in Birdview's activity before applying; a job outside that plan needs an updated plan and a new confirmation first.\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-29T20:17:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- fdfcfa366916f6cdbcd16bfbc8ec25d0ecbd8cc1 · 2026-10-29T20:17:57+08:00"},"topic-interfaces-relay-config-entry":{"body":"# 修改设置\n\n- **改设置前先复述并等用户同意**：用户经 relay-config 修改设置时"},"rule-config-confirm-first":{"body":"# 改设置前先复述并等用户同意\n\n## 什么时候用\n\n用户经 relay-config 修改设置时\n\n适用性：按条件适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n设置会影响之后所有派发；写入前让用户看到确切的键、值和文件。\n\n## 怎么检查\n\nconfig set 之前有用户的明确同意。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`skills/relay-config/SKILL.md:17-17`\n\n> 3. Say exactly what you will write and where, and wait for the user to agree. Then run `config set \u003ckey> \u003cvalue>` (or `config unset \u003ckey>`) and show `config show` again.\n\n来源文件最后修改：2026-10-29T20:17:57+08:00。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv1 · 2026-10-29T20:17:57+08:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：822bdfd0d06d4d1e8dacd20ec4892c86e72d87d7\n\n- fdfcfa366916f6cdbcd16bfbc8ec25d0ecbd8cc1 · 2026-10-29T20:17:57+08:00"},"directory-root":{"body":"# .\n\n## 本目录来源 / Local sources\n\n- AGENTS.md · 12 条已整理规则\n  核心代码不假设规划者身份：在本仓库开发或运行 agenthub-relay 时（applicable）\n  预留执行者失败关闭：在本仓库开发或运行 agenthub-relay 时（applicable）\n  零运行时依赖：在本仓库开发或运行 agenthub-relay 时（applicable）\n  skill 里的 hub 只能由 src/ 生成：修改 src/ 或发布 skill 时（applicable）\n  执行者只在自己的 worktree 写：在本仓库开发或运行 agenthub-relay 时（applicable）\n  并发写范围不得重叠：在本仓库开发或运行 agenthub-relay 时（applicable）\n  执行者禁止再派发：在本仓库开发或运行 agenthub-relay 时（applicable）\n  light 档必须有范围和检查：在本仓库开发或运行 agenthub-relay 时（applicable）\n  密钥只按变量名透传：在本仓库开发或运行 agenthub-relay 时（applicable）\n  检查按 birdview 语义记录：在本仓库开发或运行 agenthub-relay 时（applicable）\n  行为改动必须附测试：在本仓库开发或运行 agenthub-relay 时（applicable）\n  保活只用 fork 且有边界：在本仓库开发或运行 agenthub-relay 时（applicable）\n- CLAUDE.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n无已采集来源 / No collected sources\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 19 条规则，来自 4 份来源。已审阅 AGENTS.md 全部 12 条规则、CLAUDE.md，以及四个 skill 中只在规划者派发、查看任务或修改设置时适用的 7 条条件规则；docs/design.md 是设计说明，不单独提炼规则。收集器报告的唯一未解析引用是 docs/design.md 第 12 节提到的 final.md：它是任务目录 .agenthub/jobs/\u003cid>/ 里的运行时文件，不是文档，不影响规则审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-0":{"body":"# AGENTS.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n- 核心代码不假设规划者身份\n- 预留执行者失败关闭\n- 零运行时依赖\n- skill 里的 hub 只能由 src/ 生成\n- 执行者只在自己的 worktree 写\n- 并发写范围不得重叠\n- 执行者禁止再派发\n- light 档必须有范围和检查\n- 密钥只按变量名透传\n- 检查按 birdview 语义记录\n- 行为改动必须附测试\n- 保活只用 fork 且有边界\n\n## 原文 / Source\n\n> # agenthub-relay agent instructions\n> \n> These rules apply to every agent working in this repository, whichever agent is planning and whichever is executing (Claude Code, Codex, DeepSeek Harness, Antigravity or another MCP client). The design they protect is described in [docs/design.md](docs/design.md).\n> \n> ## Architecture rules\n> \n> - Keep the hub planner-neutral: code under `src/` must not assume which agent is the planner; Claude Code specific behavior lives only in `hooks/`, `types/` and `.claude-plugin/`.\n> - Use no runtime dependencies: the hub ships as plain ESM JavaScript for Node.js 20 or newer, and code under `src/` imports only the Node.js standard library.\n> - Treat Antigravity (`agy`) and the generic ACP executor as reserved until their adapters exist: dispatching to a reserved executor must fail closed with an error that names the reason.\n> - Generate `skills/agenthub-relay/scripts/` from `src/` with `npm run bundle:skill` and never edit that copy by hand; it must stay identical to `src/`, which `npm test` checks.\n> \n> ## Execution safety rules\n> \n> - Run every executor inside its own git worktree under `.agenthub/worktrees/`; the main working tree may change only through `relay_apply`.\n> - Refuse a `light` tier job unless it declares an explicit file scope and at least one check command.\n> - Refuse a write job whose scope overlaps the scope of an active write job, using directory-prefix matching (`src/api` covers `src/api/x.ts` but not `src/api-other.ts`).\n> - Mark executor processes with `AGENTHUB_RELAY_ROLE=executor`; in that role the hub must refuse dispatching and changing the relay settings, and the Claude Code mod must stay inactive.\n> - Pass secrets only by environment variable name; never write API keys or environment values into job records, logs, events or test fixtures.\n> \n> ## Verification rules\n> \n> - Record checks with Birdview semantics: `passed` requires exit code 0, `failed` requires a non-zero exit code and `not-run` requires a null exit code; a job with any failed check ends as `failed`, and a job without checks is reported as unverified.\n> - Ship every behavior change with a `node --test` test that exercises observable behavior through public interfaces; changes to `hooks/` also need `claude plugin test` coverage.\n> \n> ## Cache keep-alive rules\n> \n> - Keep the Claude Code planner's prompt cache warm only through `$.model.fork`, only while relay jobs are running, never once the cache is presumed cold, and never beyond the configured ceiling; keep-alive must not add turns to the transcript."},"directory-source-1":{"body":"# CLAUDE.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> @AGENTS.md\n> \n> ## Claude Code notes\n> \n> - This file is for agents working on this repository. The repository root is also the plugin root, where Claude Code does not load a CLAUDE.md as plugin context; `claude plugin validate .` warns about that by design.\n> - The mod in `hooks/register.ts` targets Claude Code 2.1.287 or later and is type-checked against the 2.1.312 mod types. Validate it with `claude plugin validate .` and test it with `claude plugin test .`.\n> - When Claude Code is the planner, end the turn after dispatching jobs; the mod keeps the cache warm while jobs run and wakes the session when a job finishes."},"directory-2":{"body":"# skills\n\n## 本目录来源 / Local sources\n\n无已采集来源 / No collected sources\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 12 条已整理规则\n  核心代码不假设规划者身份：在本仓库开发或运行 agenthub-relay 时（applicable）\n  预留执行者失败关闭：在本仓库开发或运行 agenthub-relay 时（applicable）\n  零运行时依赖：在本仓库开发或运行 agenthub-relay 时（applic 仓库开发或运行 agenthub-relay 时（applicable）\n- CLAUDE.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 19 条规则，来自 4 份来源。已审阅 AGENTS.md 全部 12 条规则、CLAUDE.md，以及四个 skill 中只在规划者派发、查看任务或修改设置时适用的 7 条条件规则；docs/design.md 是设计说明，不单独提炼规则。收集器报告的唯一未解析引用是 docs/design.md 第 12 节提到的 final.md：它是任务目录 .agenthub/jobs/\u003cid>/ 里的运行时文件，不是文档，不影响规则审阅。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-2":{"body":"# skills/agenthub-relay/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n- 任务里不写密钥\n- 按 watcher.active 决定怎么等待\n- completed 不等于正确\n- Birdview 启用时先确认计划再派发\n- 只在用户要求时保存执行者与模型选择\n\n## 原文 / Source\n\n> ---\n> name: agenthub-relay\n> description: Hand coding work to other agents (Codex, Claude Code, DeepSeek Harness) with the bundled relay script or the relay_* MCP tools - split the work, pick a tier and, when asked, an executor and model, write a self-contained task with scope and checks, wait, then review and apply or discard. Use when part of a task can be done by another agent in parallel or more cheaply. Not for reviewing architecture or skills.\n> ---\n> \n> # agenthub-relay: delegating to other agents\n> \n> You are the planner. Executors run in their own git worktrees; your working tree changes only when you apply a job. This works the same whichever agent plans: Claude Code, Codex, DeepSeek Harness or Antigravity.\n> \n> Do not delegate when you are yourself an executor (`AGENTHUB_RELAY_ROLE=executor`; dispatch refuses), when you cannot state the task precisely, or when explaining it costs more than doing it.\n> \n> ## How to call the relay\n> \n> Run the bundled script with Node.js 20 or newer from the repository you are working in:\n> \n> ```sh\n> node \u003cthis skill's directory>/scripts/cli.mjs \u003ccommand> --planner \u003cyou>\n> ```\n> \n> `\u003cyou>` is `claude`, `codex`, `dsh` or `agy`: say who you are on every command (or set `AGENTHUB_RELAY_PLANNER`). It picks the profile meant for your kind of planner, so that, for example, a Codex planner's deep work goes to Claude Code instead of back to Codex. Every command prints JSON; exit code 1 means the relay refused (read `error.code` and `error.message`), 2 means the command was malformed.\n> \n> If the `relay_*` MCP tools are loaded (the Claude Code plugin loads them), you may use them instead; they do the same thing and record the same jobs.\n> \n> | Command | Tool |\n> |---|---|\n> | `agents` | `relay_agents` |\n> | `dispatch --tier \u003ct> --task-file - [--scope \u003cp>]... [--check \u003cc>]... [--executor \u003cid>] [--model \u003cm>] [--effort \u003ce>] [--title \u003cs>] [--acceptance \u003cs>]` (task on stdin) | `relay_dispatch` |\n> | `wait [\u003cid>...] [--timeout \u003cs>]` | `relay_wait` |\n> | `result \u003cid>` | `relay_result` |\n> | `apply \u003cid> [--allow-out-of-scope] [--force]`, `discard \u003cid>`, `cancel \u003cid>` | `relay_apply`, `relay_discard`, `relay_cancel` |\n> | `status [\u003cid>] [--json]` | `relay_status` |\n> | `config show`, `config set \u003ckey> \u003cvalue> [--user]`, `config unset \u003ckey> [--user]` | (script only) |\n> \n> ## 1. Who executes, and with which model\n> \n> - The first time you use the relay in a project, run `config show`. If it still shows the built-in defaults, tell the user which executor and model each tier goes to and ask once whether to keep that.\n> - When the user names an executor, model or effort for a piece of work (\"give this to Claude Opus\"), pass `--executor`, `--model` and `--effort` on that dispatch only.\n> - Save a choice with `config set` only when the user asks for it to stick (\"from now on, light work uses …\"). Say what you will write before you write it. Tier values are `executor[:model][@effort]`, for example `config set profiles.thread16.deep claude:opus@high`; `--user` saves it for every project.\n> - An executor that has no flag for a model refuses one with `model-unsupported` (DeepSeek Harness sets its model in its own settings). Tell the user; do not retry with another model.\n> - You cannot change your own model from here. If the user wants a different planner model, point them to their host (in Claude Code, `/model`).\n> \n> ## 2. Split\n> \n> - Hand off pieces that are independent of each other and of what you are doing. Keep design decisions, cross-cutting changes and integration for yourself.\n> - Give concurrent write jobs disjoint scopes. A write job holds its scope until it ends, and a completed one until you apply or discard it; an overlapping dispatch is refused.\n> \n> ## 3. Pick a tier\n> \n> | Tier | For | Required | Default executor (`thread16` / `codex-planner`) |\n> |---|---|---|---|\n> | `deep` | complex or multi-file work that needs reasoning | `scope` (`\".\"` for the whole repository) | `codex` / `claude` |\n> | `light` | simple, clearly specified, mechanical work | 1-10 `scope` paths and at least one check | `dsh` (DeepSeek V4 Flash) |\n> | `review` | read-only investigation or a second opinion | nothing; any change is reported out of scope | `claude` / `codex` |\n> \n> `agents` shows the active profile, why it was chosen, and which executors are installed.\n> \n> ## 4. Write the task\n> \n> The executor sees only your task and the repository at the base commit (tracked changes included; untracked files are not, and dispatch warns about them). Write it so a capable engineer new to the code could finish it:\n> \n> - the goal and why, in a sentence or two;\n> - the files, symbols and conventions that matter;\n> - constraints: what must not change, interfaces to keep;\n> - `acceptance`: what done looks like;\n> - `checks`: shell commands that exit 0 only when the work is right. They run in the job's worktree after the executor finishes; prefer focused tests to a slow full suite.\n> \n> Pass the task on stdin (`--task-file -`) to avoid shell quoting. Never put secrets in a task. Executors receive credentials only by variable name (`passEnv` in `.agenthub/config.json`, edited by hand).\n> \n> ## 5. Wait\n> \n> - With the relay_* MCP tools in Claude Code: if the dispatch result says `watcher.active: true`, end your turn; the Claude Code mod wakes you when a job ends and keeps your prompt cache warm meanwhile.\n> - Otherwise run `wait` (50 seconds by default; `--timeout` up to 3600 if your shell allows long commands), doing other useful work between calls, until a job finishes.\n> \n> ## 6. Review and integrate\n> \n> 1. `result \u003cid>`: summary, model, checks, changed files, out-of-scope files, patch stat and log paths. Read the patch (`logs.patch`) for anything that is not trivial.\n> 2. If it is right, `apply \u003cid>`. The changes land unstaged in your working tree; review and commit them as your own. Out-of-scope changes need `--allow-out-of-scope`, and only after you have read them; a failed or cancelled job needs `--force`.\n> 3. Otherwise `discard \u003cid>`, then improve the task or move it up a tier and dispatch again.\n> 4. `cancel \u003cid>` stops a job you no longer need.\n> \n> A completed job is not proof: \"checks passed\" covers only what the checks test, and a job without checks is unverified.\n> \n> ## With Birdview\n> \n> When Birdview is active for the task, confirm Birdview's displayed plan, or the birdview-review proposal being implemented, before dispatching any job that changes files; dispatched jobs are part of that plan's scope and are recorded as its activity. Read-only `review` jobs may run before confirmation."},"directory-3":{"body":"# skills/relay-config\n\n## 本目录来源 / Local sources\n\n- skills/relay-config/SKILL.md · 1 条已整理规则\n  改设置前先复述并等用户同意：用户经 relay-config 修改设置时（conditional）\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 12 条已整理规则\n  核心代码不假设规划者身份：在本仓库开发或运行 agenthub-relay 时（applicable）\n  预留执行者失败关闭：在本仓库开发或运行 agenthub-relay 时（applicable）\n  零运行时依赖：在本仓库开发或运行 agenthub-relay 时（applicable）\n  skill 里的 hub 只能由 src/ 生成：修改 s cutors.\u003ccodex|claude|dsh>.model` or `.effort`;\n>    - which profile a planner gets: `plannerProfiles.\u003cclaude|codex|dsh|agy>`; the default profile: `profile`.\n>    Use `--user` when the user wants the setting for every project; otherwise it is saved in this repository's `.agenthub/config.json`.\n> 3. Say exactly what you will write and where, and wait for the user to agree. Then run `config set \u003ckey> \u003cvalue>` (or `config unset \u003ckey>`) and show `config show` again.\n> \n> DeepSeek Harness has no documented flag for choosing a model: the relay refuses a model for it, and its model is set in DeepSeek Harness's own settings. Credentials (`passEnv`) are not settable here; they are edited by hand and hold variable names only. This skill cannot change the planner's own model; in Claude Code that is `/model`."},"directory-4":{"body":"# skills/relay-review\n\n## 本目录来源 / Local sources\n\n- skills/relay-review/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 12 条已整理规则\n  核心代码不假设规划者身份：在本仓库开发或运行 agenthub-relay 时（applicable）\n  预留执行者失败关闭：在本仓库开发或运行 agenthub-relay 时（applicable）\n  零运行时依赖：在本仓库开发或运行 agenthub-relay 时（applicable）\n  skill 里的 hub 只能由 src/ 生成：修改 src/ 或发布 skill 时（applicable）\n  执行者只在自己的 worktree 写：在本仓库开发或运行 agenthub-relay 时（applicable）\n  并发写范围不得重叠：在本仓库开发或运行 agenthub-relay 时（applicable）\n  执行者禁止再派发：在本仓库开发或运行 agenthub-relay 时（applicable）\n  light 档必须有范围和检查：在本仓库开发或运行 agenthub-relay 时（applicable）\n  密钥只按变量名透传：在本仓库开发或运行 agenthub-relay 时（applicable）\n  检查按 birdview 语义记录：在本仓库开发或运行 agenthub-relay 时（applicable）\n  行为改动必须附测试：在本仓库开发或运行 agenthub-relay 时（applicable）\n  保活只用 fork 且有边界：在本仓库开发或运行 agenthub-relay 时（applicable）\n- CLAUDE.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 19 条规则，来自 4 份来源。已审阅 AGENTS.md 全部 12 条规则、CLAUDE.md，以及四个 skill 中只在规划者派发、查看任务或修改设置时适用的 7 条条件规则；docs/design.md 是设计说明，不单独提 Claude Code 当主调度，复杂任务交给 Codex，简单明确的任务交给 DeepSeek V4 Flash，再写一个 mod，让 Claude Code 在等待其他 agent 时每 55 分钟保活缓存。\n> \n> agenthub-relay 把这个思路做成一个中立的 hub：对上用 MCP 工具接任何规划者，对下用各家官方的无人值守模式驱动执行者。目标是让规划者只花少量 token 做拆分、派发和验收，把实现性的 token 消耗转给更便宜或已付费的执行者。\n> \n> ## 2. 思路核对结论\n> \n> 1. 互调可行：所列工具都提供让一个 agent 启动另一个 agent 的接口（CLI、MCP 或 ACP），但没有一个原生覆盖本项目要接的全部四家，因此 v0.1 自建 hub。\n> 2. DeepSeek 的官方模型名现为 `deepseek-flash`，旧名 `deepseek-v4-flash` 仍被接受并路由到同一模型。\n> 3. 55 分钟保活只在 Claude Code 主会话缓存 TTL 为 1 小时时有效。订阅额度内默认 1 小时；API key、超额计费和云厂商默认 5 分钟，需要设置 `CLAUDE_CODE_PROMPT_CACHE_TTL=1h` 或 `promptCacheTtl`。\n> 4. \"mods\" 是 Claude Code 2.1.287 起默认开启的功能。保活用 `$.model.fork`：它按主会话上一次请求原样发送并读取缓存前缀，不向对话追加轮次。\n> \n> ## 3. 角色模型\n> \n> 规划者和执行者不固定。任何能加载 MCP 服务的 agent 都可以当规划者：Claude Code、Codex、DeepSeek Harness、Antigravity。执行者由档位映射决定，v0.1 实现 Claude Code、Codex、DeepSeek Harness 三家，Antigravity 只在配置里预留。\n> \n> 档位（tier）描述任务性质，不描述代理：\n> \n> | 档位 | 含义 | 默认执行者（16 楼档位） | 护栏 |\n> |---|---|---|---|\n> | deep | 复杂、多文件、需要推理的实现或排错 | codex | 必须声明范围 |\n> | light | 简单且明确的机械性任务 | dsh（DeepSeek Harness，`deepseek-flash`） | 必须声明文件范围和至少一条检查命令 |\n> | review | 只读审查或调研 | claude | 只读，任何改动都记为越界 |\n> \n> 档位到执行者的映射按配置里的 profile 切换，例如以 Codex 为规划者时可把 deep 映射到 claude。\n> \n> ## 4. 模块\n> \n> | id | 职责 | 计划路径 |\n> |---|---|---|\n> | planner-surface | MCP 工具面与 CLI，是所有规划者的唯一入口，不假设规划者身份 | `src/mcp.mjs` `src/tools.mjs` `src/cli.mjs` |\n> | dispatch-policy | 档位映射、light 档护栏、并发写范围冲突锁、预留代理失败关闭、执行者禁止再派发 | `src/policy.mjs` `src/config.mjs` |\n> | job-store | 任务记录与状态机、事件日志、原子写、心跳存活检测 | `src/store.mjs` |\n> | git-isolation | 每个任务一个 git worktree、基线提交、变更清单、越界审计、补丁应用与丢弃 | `src/git.mjs` |\n> | executor-adapters | 三家执行者的命令构造与输出解析，agy 与 ACP 预留 | `src/executors.mjs` |\n> | worker-runner | 分离进程中的 worker：超时与取消、运行检查、收尾 | `src/worker.mjs` `src/checks.mjs` |\n> | claude-planner-mod | Claude Code 规划者专用 mod：保活、任务结束唤醒、`/relay` 命令、状态行 | `hooks/` `types/` `.claude-plugin/` `.mcp.json` |\n> | relay-skill | 可移植的路由手册（Agent Skills 标准），教规划者拆分、选档、写任务、等待和验收 | `skills/agenthub-relay/SKILL.md` |\n> \n> 外部模块：planner-hosts（任一 MCP 客户端规划者）、executor-clis（codex、claude、dsh；agy 预留）、anthropic-cache（Claude 主会话提示缓存）。\n> \n> ## 5. 关系\n> \n> - 规划者调用 planner-surface 的 `relay_*` 工具。\n> - planner-surface 先让 dispatch-policy 校验档位、范围与冲突；dispatch-policy 读取 job-store 中活跃任务的范围声明。\n> - planner-surface 在 job-store 建记录，经 git-isolation 建 worktree，再以分离进程启动 worker-runner。\n> - worker-runner 通过 executor-adapters 调用 executor-clis，从 git-isolation 取变更清单做越界审计，把状态迁移、心跳和结果写回 job-store。\n> - claude-planner-mod 通过 `$.mcp.call` 查询任务状态，用 `$.model.fork` 刷新主会话缓存，任务结束时用 `$.prompt.submit` 唤醒 Claude Code。\n> \n> ## 6. 任务生命周期\n> \n> 状态：`queued` → `running` → `verifying` → `completed` | `failed` | `cancelled`；集成状态另记 `none` | `applied` | `discarded`。\n> \n> 1. 派发：校验护栏后取基线提交（主工作区有未提交改动时用 `git stash create` 的快照提交），在 `.agenthub/worktrees/\u003cjob>` 建分支 `agenthub/\u003cjob>`。\n> 2. 运行：worker 以 `AGENTHUB_RELAY_ROLE=executor` 启动执行者，每 30 秒写心跳；超时或取消时按进程组终止。\n> 3. 检查：在 worktree 里逐条运行检查命令，退出码 0 为 passed，非 0 为 failed，未运行为 not-run；任何一条失败则任务为 failed，没有检查则报告为未验证。\n> 4. 审计：对比基线列出改动文件，范围外的文件列为越界。\n> 5. 集成：规划者看过 `relay_result` 后调用 `relay_apply`（先 `git apply --check`）或 `relay_discard`。\n> \n> ## 7. MCP 工具\n> \n> | 工具 | 作用 |\n> |---|---|\n> | `relay_agents` | 列出执行者、可用性、当前 profile 的档位映射和预留项 |\n> | `relay_dispatch` | 按档位或指定执行者派发任务，返回任务 id、worktree 与基线提交 |\n> | `relay_status` | 查询一个或全部任务的状态 |\n> | `relay_wait` | 最多等待 50 秒，任一任务结束即返回，供没有 mod 的规划者使用 |\n> | `relay_result` | 摘要、改动文件、越界文件、检查结果和日志路径 |\n> | `relay_apply` | 把任务补丁应用到主工作区 |\n> | `relay_discard` | 删除任务 worktree 与分支 |\n> | `relay_cancel` | 终止运行中的任务 |\n> \n> ## 8. 执行者适配\n> \n> | 执行者 | 调用方式 | 输出 |\n> |---|---|---|\n> | codex | `codex exec --json --sandbox workspace-write -o \u003c最终消息文件> -`，任务从 stdin 传入 | JSONL 事件，最终消息写入文件 |\n> | claude | `claude -p --output-format json --permission-mode acceptEdits --permission-prompts none`，检查命令加入 `--allowedTools` | JSON 中的 `result` 与用量 |\n> | dsh | `dsh --profile headless \"\u003c任务>\"` | stdout 为最后一条回答，完成退出码 0，否则 1 |\n> | agy | 预留，派发时报错 | — |\n> \n> 执行者只继承 PATH、HOME、语言设置和配置里列出的变量名；密钥值不进入任何记录。\n> \n> ## 9. Claude Code 保活 mod\n> \n> - 计时起点是主会话最后一次模型请求的开始时间，因为缓存寿命从读写缓存的请求开始算。\n> - 条件：保活开启、有任务在运行、主会话空闲、距上次请求或上次 fork 达到间隔（默认 55 分钟），且距今仍在 60 分钟内（缓存仍热）；超过上限（默认距最后一次真实请求 8 小时）停止。\n> - 动作：`$.model.fork` 发一个只要求回复 OK 的问题；记录 `cache_read_input_tokens`。读到 0 且写入很大说明缓存已过期（多半是 5 分钟 TTL），此时暂停保活并提示设置 1 小时 TTL。\n> - 唤醒：任务进入终态时用 `$.prompt.submit` 发一条提示，引导规划者调用 `relay_result`。\n> - 空闲压缩：Claude Code 在 1 小时 TTL 下可能于缓存到期前自动压缩空闲会话；mod 记录这类压缩事件，便于判断 fork 是否重置了该计时。\n> \n> 经济性：1 小时缓存写入是基础输入价的 2 倍，读取是 0.1 倍（Opus 5.5 与 Sonnet 5.5 为 0.05 倍），所以在约 18 到 36 小时的等待内保活都比重新写入便宜；默认上限 8 小时。\n> \n> ## 10. 安全与隔离\n> \n> - 执行者只在自己的 worktree 写；主工作区只经 `relay_apply` 改变。\n> - 并发写任务的范围按目录前缀判断，重叠即拒绝。\n> - 执行者环境带 `AGENTHUB_RELAY_ROLE=executor`，此时 hub 拒绝再派发，mod 自停，防止递归。\n> - 范围声明和越界审计是事后核对，不是文件系统写锁。\n> \n> ## 11. 路线图\n> \n> - 之后：通用 ACP 执行器（Claude 经 `claude-agent-acp`、Codex 经 `codex-acp`、dsh 原生 `--profile acp`、agy 官方 ACP server），之后可把 Paseo、bb、Lody 作为可选后端。\n> - Antigravity headless 适配器（`agy -p --output-format json`）。\n> \n> ## 12. 实现与设计的差异（v0.1）\n> \n> 1. MCP 服务内联写在 `.claude-plugin/plugin.json` 的 `mcpServers`，不建根目录 `.mcp.json`：否则用 Claude Code 打开本仓库时，它会被当成项目级 MCP 服务，而 `${CLAUDE_PLUGIN_ROOT}` 在那里无法展开。\n> 2. 观察者（`relay_status` 的 `watch: true`）记在 MCP 服务进程的内存里，不写盘：从未派发过任务的仓库不会多出 `.agenthub/`，多个规划者共用一个仓库时也不会把别人的观察者当成自己的。\n> 3. 取消一律经由 worker 完成：发送 SIGTERM，worker 启动时和每次心跳时也会检查取消标记；worker 已不在时，存活检测把任务对账为 cancelled，而不是 worker-lost。\n> 4. `passEnv` 变量的值在执行者与检查的输出、日志、`final.md` 和存储的补丁里都替换为 `[redacted]`，跨输出块也能识别；执行者把密钥写进仓库文件时，任务会给出警告。\n> 5. light 档的范围不能是整个仓库（`.`）；已完成但尚未 apply 或 discard 的写任务继续占用它的范围。\n> 6. 插件选项键名为 `keep_alive`、`interval_minutes`、`ceiling_hours`、`wake_on_finish`；mod 只为本会话盯过（见过正在运行）的任务发唤醒。\n> \n> ## 13. v0.2：skill 自带脚本，在使用中选择规划者、执行者与模型\n> \n> 起因是第 2 轮架构评审的候选 skill-cli，以及“skill 没法设置模型、也没法决定谁规划谁执行”的反馈。\n> \n> 1. **CLI 走完全流程**：`agents`、`dispatch`、`wait`、`result`、`apply`、`discard`、`cancel`、`status`、`config` 都经 `createRelay().call()`，与 MCP 共用同一套派发顺序和记录；JSON 输出，退出码 0/1/2。`createRelay` 的 `maxWaitSeconds` 让 MCP 保持 50 秒、CLI 最长 3600 秒。\n> 2. **skill 自带 hub**：`skills/agenthub-relay/scripts/` 是 `src/` 的生成副本（`npm run bundle:skill`），复制整个 skill 目录即可使用，测试保证副本与源码一致。`src/` 仍是唯一源码。\n> 3. **规划者身份**：`--planner`、`AGENTHUB_RELAY_PLANNER` 或 MCP 客户端名识别出 claude、codex、dsh、agy 或 unknown，写进任务记录。profile 的选取顺序：`AGENTHUB_RELAY_PROFILE` → 配置里的 `plannerProfiles` → 配置里的 `profile` → 内置的规划者默认（codex → `codex-planner`）→ `thread16`。hub 仍不假设谁在规划，身份只用来选 profile。\n> 4. **模型与推理强度**：档位映射可写 `{executor, model, effort}`，执行者有默认 `model`/`effort` 与参数模板 `modelArgs`/`effortArgs`。单个任务的取值：请求 → 档位映射（仅当执行者相同）→ 执行者默认。没有对应参数的执行者（dsh）以 `model-unsupported`/`effort-unsupported` 失败关闭，不静默忽略。\n> 5. **设置**：用户级文件在下、项目级文件在上；`config set/unset` 只开放 profile、plannerProfiles、档位路由和执行者的 model/effort/command/timeoutMinutes，写前校验，原子替换；`passEnv` 仍只能手改。执行者角色不能改设置。\n> 6. **入口**：`relay-review`、`relay-status`、`relay-config` 三个只能显式调用的薄入口，共用同一脚本；Birdview 启用时 relay-status 只 apply 已确认计划内的任务。\n> 7. 规划者自身的模型由宿主决定，不在本项目范围内。\n> \n> ## 来源\n> \n> - [linux.do 话题 3028918](https://linux.do/t/topic/3028918)\n> - [Claude Code：How Claude Code uses prompt caching](https://code.claude.com/docs/en/prompt-caching.md)\n> - [Claude Code：Mods overview](https://code.claude.com/docs/en/plugins/mods/overview.md)\n> - [Claude API：Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)\n> - [Claude Code：Run Claude Code programmatically](https://code.claude.com/docs/en/headless.md)\n> - [Codex：Non-interactive mode](https://learn.chatgpt.com/docs/non-interactive-mode)\n> - [DeepSeek：V4 Flash 更新](https://api-docs.deepseek.com/news/v4-flash)\n> - [DeepSeek Harness headless README](https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/bundle/headless/README.md)\n> - [Antigravity CLI：Headless mode](https://antigravity.google/docs/cli/headless/)\n> - [Agent Client Protocol：Agents](https://agentclientprotocol.com/get-started/agents)"}}},"snapshot":"822bdfd0d06d4d1e8dacd       if (review) review.textContent = isChinese2() ? "\u8BC4\u5BA1" : "Review";
    };
    if (review) {
      review.href = DATA.reviewHref;
      nav.append(review);
    }
    labels();
    new MutationObserver(labels).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    if (DATA.constraintView) mountConstraintView(nav, architecture, review);
  }
  function mountConstraintView(nav, architecture, review) {
    const view = required(DATA.constraintView);
    const main = query("body > main");
    const constraints = document.createElement("button");
    constraints.type = "button";
    nav.insertBefore(constraints, review ?? null);
    main.id = "architecture-view";
    architecture.setAttribute("aria-controls", main.id);
    const panel = document.createElement("section");
    panel.id = "constraint-view";
    panel.hidden = true;
    constraints.setAttribute("aria-controls", panel.id);
    main.after(panel);
    const related = document.createElement("button");
    related.id = "open-related-constraints";
    related.type = "button";
    $("module-content").append(related);
    let active = false;
    let canvas;
    const label = (zh, en) => isChinese2() ? zh : en;
    const sync = () => {
      nav.setAttribute("aria-label", label("\u9879\u76EE\u89C6\u56FE", "Project views"));
      architecture.textContent = label("\u67B6\u6784", "Architecture");
      constraints.textContent = label("\u7EA6\u675F", "Constraints");
      architecture.setAttribute("aria-pressed", String(!active));
      constraints.setAttribute("aria-pressed", String(active));
      const count = view.rules.filter((rule) => rule.modules.includes(selectedModuleId ?? "")).length;
      related.textContent = count ? label(`\u67E5\u770B\u5173\u8054\u7EA6\u675F\u56FE \xB7 ${count}`, `View related rules \xB7 ${count}`) : label("\u5C1A\u672A\u8BB0\u5F55\u6A21\u5757\u4E0E\u89C4\u5219\u7684\u5173\u8054", "No module-rule links recorded");
      related.disabled = !count;
    };
    const show = (value) => {
      active = value;
      main.hidden = value;
      panel.hidden = !value;
      if (value && !canvas) canvas = mountConstraintCanvas(panel, view.graph);
      const hash = new URLSearchParams(location.hash.slice(1));
      hash.set("view", value ? "constraints" : "architecture");
      try {
        history.replaceState(null, "", `#${hash}`);
      } catch {
      }
      sync();
      requestAnimationFrame(() => canvas?.resize());
      window.dispatchEvent(new Event("resize"));
    };
    architecture.onclick = () => show(false);
    constraints.onclick = () => show(true);
    related.onclick = () => {
      show(true);
      canvas?.filter(view.rules.filter((rule) => rule.modules.includes(selectedModuleId ?? "")).map((rule) => rule.id));
    };
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    new MutationObserver(sync).observe($("module-constraints"), { childList: true, subtree: true });
    show(new URLSearchParams(location.hash.slice(1)).get("view") === "constraints");
  }
})();
</script>
</body>
</html>
